name: CI

on:
  pull_request:
  push:
    branches: [main]
    # No tag trigger. Tags are pushed by the release workflow using GITHUB_TOKEN, and GitHub does
    # not run workflows for those pushes, so a tag trigger here would never fire. Releases are
    # packaged inside release.yml instead, in the same job that creates the tag.

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # module.json names these files explicitly. If the build ever emits different names, Foundry
      # loads nothing at all and does so silently, so this is checked rather than assumed.
      - name: Verify build output filenames match the manifest
        run: |
          test -f dist/tongs-browser.js || { echo "Missing dist/tongs-browser.js"; exit 1; }
          test -f dist/tongs-browser.css || { echo "Missing dist/tongs-browser.css"; exit 1; }
          echo "Build output matches module.json."

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium. These tests exist to cover what jsdom cannot, which is layout and real hit
      # testing, and that is not browser specific enough to justify the extra runtime.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The browser tests load the built bundle over http, not the source, because the bundle is
      # what actually ships.
      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
