name: CI

on:
  pull_request:
  push:
    branches: [main]
    # No tag trigger. Tags are pushed by the release workflow using GITHUB_TOKEN, and GitHub does
    # not run workflows for those pushes, so a tag trigger here would never fire. Releases are
    # packaged inside release.yml instead, in the same job that creates the tag.

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ⚠️ `verify`, not the four steps it used to list.
      #
      # This job ran lint, typecheck, test and build. `npm run verify` runs those AND five guards that
      # were therefore enforced nowhere except a developer's memory:
      #
      #   check:sizes         the 200 line limit, the project's headline rule
      #   check:readmes       every source folder documented
      #   check:scripts       every script still loads
      #   check:support       no shared fixture that nothing imports
      #   typecheck:scripts   the harness typechecks too
      #
      # A 232 line test file merged green on 2026-08-18 because of this, which is how it was noticed.
      # Naming the composite script rather than re-listing its parts means a guard added to `verify`
      # is a guard CI runs, instead of one somebody has to remember to add here as well.
      - name: Verify
        run: npm run verify

      # module.json names these files explicitly. If the build ever emits different names, Foundry
      # loads nothing at all and does so silently, so this is checked rather than assumed.
      - name: Verify build output filenames match the manifest
        run: |
          test -f dist/tongs-browser.js || { echo "Missing dist/tongs-browser.js"; exit 1; }
          test -f dist/tongs-browser.css || { echo "Missing dist/tongs-browser.css"; exit 1; }
          echo "Build output matches module.json."

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium. These tests exist to cover what jsdom cannot, which is layout and real hit
      # testing, and that is not browser specific enough to justify the extra runtime.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The browser tests load the built bundle over http, not the source, because the bundle is
      # what actually ships.
      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
